global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: control-panel
    static_configs:
      - targets: ["control-panel:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:9100"]

  - job_name: odoo-tenants
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_saas_tenant_id]
        action: keep
        regex: .+
      - source_labels: [__meta_docker_container_label_saas_tenant_id]
        target_label: tenant_id
      - source_labels: [__address__]
        target_label: __address__
        regex: (.+)
        replacement: "${1}:8069"
