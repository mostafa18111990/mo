version: "3.9"

networks:
  saas_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  traefik_acme:
  backups:

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    networks: [saas_net]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/acme
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth@file"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [saas_net]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [saas_net]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-panel:
    build: ./control-panel
    restart: unless-stopped
    networks: [saas_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic/tenants:/etc/traefik/dynamic/tenants
      - backups:/app/data/backups
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${ADMIN_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api.middlewares=security@file,ratelimit@file,compress@file"
    deploy:
      replicas: 3

  celery-worker:
    build: ./control-panel
    restart: unless-stopped
    networks: [saas_net]
    depends_on:
      - control-panel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic/tenants:/etc/traefik/dynamic/tenants
      - backups:/app/data/backups
    env_file: .env
    command: celery -A app.worker worker --loglevel=info --concurrency=4

  celery-beat:
    build: ./control-panel
    restart: unless-stopped
    networks: [saas_net]
    depends_on:
      - redis
    env_file: .env
    command: celery -A app.worker beat --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [saas_net]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.middlewares=security@file,compress@file"

  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    networks: [saas_net]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    networks: [saas_net]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
