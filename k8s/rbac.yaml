apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-panel
  namespace: odoo-saas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-panel-role
  namespace: odoo-saas
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-panel-rolebinding
  namespace: odoo-saas
subjects:
  - kind: ServiceAccount
    name: control-panel
    namespace: odoo-saas
roleRef:
  kind: Role
  name: control-panel-role
  apiGroup: rbac.authorization.k8s.io
