http:
  middlewares:
    security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1m

    compress:
      compress: {}

    suspended-redirect:
      redirectRegex:
        regex: ".*"
        replacement: "https://${ADMIN_DOMAIN}/suspended"
        permanent: false

    auth:
      basicAuth:
        users:
          - "admin:$apr1$changeme$hashed_password_here"
